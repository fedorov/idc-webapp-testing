name: IDC Viewer Screenshot Gallery
run-name: Viewer gallery (${{ inputs.comparison || 'test-prod' }})

on:
  schedule:
    - cron: '0 5 * * 0'   # weekly, Sunday 5 AM UTC
  workflow_dispatch:       # manual trigger
    inputs:
      comparison:
        description: 'Viewer tiers to compare'
        type: choice
        default: test-prod
        options:
          - test-prod   # production vs testing
          - dev-test    # testing vs dev

# Only one Pages deploy can run at a time
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gallery:
    name: Capture screenshots and publish comparison gallery
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # Resolve the two tiers to compare. Scheduled runs have no inputs and
      # fall back to test-prod. Tier A is the more stable tier (left column).
      # -----------------------------------------------------------------------
      - name: Select tiers
        env:
          COMPARISON: ${{ inputs.comparison || 'test-prod' }}
        run: |
          PROD_BASE=https://viewer.imaging.datacommons.cancer.gov
          TEST_BASE=https://testing-viewer.canceridc.dev
          DEV_BASE=https://dev-viewer.canceridc.dev
          case "$COMPARISON" in
            test-prod)
              A_LABEL=Production; A_BASE=$PROD_BASE; A_DIR=production
              B_LABEL=Testing;    B_BASE=$TEST_BASE; B_DIR=testing ;;
            dev-test)
              A_LABEL=Testing;    A_BASE=$TEST_BASE; A_DIR=testing
              B_LABEL=Dev;        B_BASE=$DEV_BASE;  B_DIR=dev ;;
            *)
              echo "Unknown comparison: $COMPARISON" >&2; exit 1 ;;
          esac
          {
            echo "COMPARISON=$COMPARISON"
            echo "A_LABEL=$A_LABEL"; echo "A_BASE=$A_BASE"; echo "A_DIR=screenshots/$A_DIR"
            echo "B_LABEL=$B_LABEL"; echo "B_BASE=$B_BASE"; echo "B_DIR=screenshots/$B_DIR"
          } >> "$GITHUB_ENV"
          echo "Comparing $A_LABEL ($A_BASE) vs $B_LABEL ($B_BASE)"

      # -----------------------------------------------------------------------
      # Run 1 — tier A viewer (inventory URLs with base replaced; a no-op for
      # production since the inventory already uses the production base)
      # -----------------------------------------------------------------------
      - name: Capture screenshots — ${{ env.A_LABEL }} viewer
        run: |
          node scripts/viewer-gallery.js \
            --label "$A_LABEL" \
            --out "$A_DIR" \
            --viewer-base "$A_BASE" \
            --concurrency 4 \
            --wait 120000 \
            --timeout 180000

      # -----------------------------------------------------------------------
      # Run 2 — tier B viewer (same URLs, base replaced)
      # -----------------------------------------------------------------------
      - name: Capture screenshots — ${{ env.B_LABEL }} viewer
        run: |
          node scripts/viewer-gallery.js \
            --label "$B_LABEL" \
            --out "$B_DIR" \
            --viewer-base "$B_BASE" \
            --concurrency 4 \
            --wait 120000 \
            --timeout 180000

      # -----------------------------------------------------------------------
      # Build comparison index page
      # -----------------------------------------------------------------------
      - name: Build comparison page
        run: |
          node scripts/build-comparison.js "$A_DIR" "$B_DIR" screenshots/

      # -----------------------------------------------------------------------
      # Deploy screenshots/ to GitHub Pages
      # -----------------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload gallery as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: screenshots/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # -----------------------------------------------------------------------
      # Write job summary (after deploy so page_url is available)
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          pass_count() {
            node -e "const r=JSON.parse(require('fs').readFileSync('$1/results.json','utf8')); console.log(r.results.filter(x=>x.ok).length+'/'+r.results.length)" 2>/dev/null || echo '?/?'
          }
          {
            echo "## Viewer Gallery (${COMPARISON:-?})"
            echo ""
            echo "| Environment | Viewer | Result |"
            echo "|---|---|---|"
            echo "| ${A_LABEL:-?} | ${A_BASE:-?} | $(pass_count "$A_DIR") screenshots OK |"
            echo "| ${B_LABEL:-?} | ${B_BASE:-?} | $(pass_count "$B_DIR") screenshots OK |"
            echo ""
            echo "**Gallery URL:** ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
